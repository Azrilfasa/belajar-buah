<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Pembelajaran Anak</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Hayuk Belajar bersama gue</h1>
      <p class="subtitle">Pilih kegiatan yang ingin kamu lakukan</p>

      <div class="menu">
        <button class="menu-card" onclick="materi()">
          <div class="icon">📚</div>
          <h2>Materi</h2>
          <p>Yuk kenali berbagai macam buah!</p>
        </button>

        <button class="menu-card" onclick="kuis()">
          <div class="icon">📝</div>
          <h2>Kuis</h2>
          <p>Uji pengetahuanmu dengan soal!</p>
        </button>

        <button class="menu-card" onclick="game()">
          <div class="icon">🎮</div>
          <h2>Game</h2>
          <p>Belajar sambil bermain!</p>
        </button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
